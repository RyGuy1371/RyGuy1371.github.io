<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Spacebar Clicker </title>
    <style>
        /* THE OFFICIAL DOTTED BACKGROUND */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #e5e5d1; 
            background-image: radial-gradient(#d4d4bc 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            color: #4a4a32;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            overflow: hidden;
        }

        /* MAIN GAME COLUMN */
        .game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #count { font-size: 110px; font-weight: bold; margin: 0; line-height: 1; }
        #cps-text { font-size: 22px; margin-top: 10px; margin-bottom: 40px; color: #6b6b4d; }

        /* THE CLICKABLE 3D SPACEBAR */
        #spacebar {
            width: 85%;
            max-width: 480px;
            height: 90px;
            background: linear-gradient(to bottom, #d9d9c3 0%, #b8b89d 100%);
            border: 4px solid #3d3d29;
            border-radius: 18px;
            box-shadow: 0 12px 0 #3d3d29;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.05s ease;
        }

        #spacebar.active { transform: translateY(8px); box-shadow: 0 4px 0 #3d3d29; }
        .label { font-size: 16px; font-weight: bold; letter-spacing: 12px; color: #8c8c6b; text-transform: uppercase; }

        /* FUNCTIONAL UPGRADES SIDEBAR */
        .shop {
            width: 300px;
            background: rgba(0, 0, 0, 0.05);
            border-left: 3px solid #3d3d29;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .upgrade {
            background: #d9d9c3;
            border: 2px solid #3d3d29;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }

        .upgrade:hover:not(.locked) { background: #eaea8a; }
        .upgrade.locked { opacity: 0.4; cursor: not-allowed; }
        .u-name { font-weight: bold; font-size: 16px; }
        .u-cost { font-size: 14px; color: #555; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="game-screen">
        <div id="count">0</div>
        <div id="cps-text">per second: 0.000</div>
        <div id="spacebar">
            <span class="label">Spacebar</span>
        </div>
    </div>

    <div class="shop" id="shop">
        <h2 style="margin: 0 0 15px 0; font-size: 20px; text-align: center; letter-spacing: 2px;">UPGRADES</h2>
        </div>

    <script>
        let score = 0;
        let autoCps = 0;

        const shopItems = [
            { name: "Monkey", cost: 15, power: 0.1 },
            { name: "Boomer Mom", cost: 100, power: 1.0 },
            { name: "Gen Z Kid", cost: 500, power: 5.0 },
            { name: "Autoclicker", cost: 2000, power: 20.0 }
        ];

        function updateUI() {
            document.getElementById('count').innerText = Math.floor(score);
            document.getElementById('cps-text').innerText = `per second: ${autoCps.toFixed(3)}`;
            
            const shop = document.getElementById('shop');
            const title = shop.querySelector('h2');
            shop.innerHTML = '';
            shop.appendChild(title);

            shopItems.forEach((item, i) => {
                const btn = document.createElement('div');
                btn.className = `upgrade ${score < item.cost ? 'locked' : ''}`;
                btn.innerHTML = `
                    <span class="u-name">${item.name} (+${item.power})</span>
                    <span class="u-cost">Cost: ${Math.floor(item.cost)}</span>
                `;
                btn.onclick = () => buyItem(i);
                shop.appendChild(btn);
            });
        }

        function buyItem(i) {
            const item = shopItems[i];
            if (score >= item.cost) {
                score -= item.cost;
                autoCps += item.power;
                item.cost *= 1.15; // Original price scaling
                updateUI();
            }
        }

        function press() {
            score++;
            document.getElementById('spacebar').classList.add('active');
            updateUI();
        }

        function lift() {
            document.getElementById('spacebar').classList.remove('active');
        }

        // Auto-click logic loop
        setInterval(() => {
            if (autoCps > 0) {
                score += (autoCps / 10);
                updateUI();
            }
        }, 100);

        // Control Listeners (Keyboard & Mouse)
        window.onkeydown = (e) => { 
            if(e.code === 'Space') { 
                e.preventDefault(); 
                if(!e.repeat) press(); 
            } 
        };
        window.onkeyup = (e) => { if(e.code === 'Space') lift(); };
        
        const sb = document.getElementById('spacebar');
        sb.onmousedown = (e) => { if(e.button === 0) press(); };
        window.onmouseup = lift;

        // Initialize
        updateUI();
    </script>
</body>
</html>
