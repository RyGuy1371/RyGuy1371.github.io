<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classes</title>
    <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png" />
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; align-items: center; justify-content: center;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #loader {
            position: absolute;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            z-index: 20;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover { background: #45a049; }
    </style>

    <script src="https://cdn.jsdelivr.net/gh/scheng123321/tmm-html5-cdn1@51a72f0faa2d9cd524a0c11b4ca368350f988458/slope/TemplateData/unityloader41.js"></script>
</head>

<body>
    <div id="loader">
        <button id="play-btn" onclick="initGame()">Click to Load Slope</button>
        <p id="status-text" style="display:none;">Downloading Game Data... (This may take 30s)</p>
    </div>

    <div id="gameContainer"></div>

    <script>
        function initGame() {
            document.getElementById("play-btn").style.display = "none";
            document.getElementById("status-text").style.display = "block";
            
            // Unity WebGL Loader Configuration
            var gameInstance = UnityLoader.instantiate(
                "gameContainer", 
                "https://cdn.jsdelivr.net/gh/scheng123321/tmm-html5-cdn1@51a72f0faa2d9cd524a0c11b4ca368350f988458/slope/Build/slope.json", 
                {
                    onProgress: function(instance, progress) {
                        if (progress === 1) {
                            document.getElementById("loader").style.display = "none";
                        }
                    }
                }
            );
        }

        // Prevent keys from scrolling
        window.addEventListener("keydown", function(e) {
            if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
        }, false);
    </script>
</body>
</html>
