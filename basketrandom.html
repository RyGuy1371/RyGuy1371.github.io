<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basket Random | x</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* This wrapper forces the game to the center without 'flex' breaking the engine */
        #c2canvasdiv {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;  /* Match your canvas width */
            height: 450px; /* Match your canvas height */
            margin-left: -400px; /* Half of width */
            margin-top: -225px;  /* Half of height */
        }

        canvas {
            width: 800px;
            height: 450px;
            user-select: none;
            touch-action: none;
        }

        /* Mobile fix: If screen is small, scale the whole div */
        @media (max-width: 800px), (max-height: 450px) {
            #c2canvasdiv {
                transform: scale(0.5); /* Shrinks it to fit smaller screens */
            }
        }
    </style>
</head>
<body>
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="800" height="450">
            <h1>Your browser does not support HTML5.</h1>
        </canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/box2d.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/c2runtime.js"></script>

    <script>
        window.addEventListener("load", function() {
            window.focus();
            document.getElementById("c2canvas").focus();
        });

        // Prevents arrow keys from moving the browser window
        window.addEventListener("keydown", function(e) { 
            if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) { e.preventDefault(); } 
        }, false);
    </script>
</body>
</html>
