<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basket Random | Centered Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* This setup centers the game without breaking the engine */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: grid; /* Using Grid instead of Flex */
            place-items: center; /* This is the cleanest way to center */
        }

        #c2canvasdiv {
            /* We remove the 100% width/height here so the engine doesn't stretch into a black void */
            display: inline-block;
            position: relative;
        }

        canvas {
            /* This ensures the game stays visible and sharp */
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="800" height="450"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/box2d.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/c2runtime.js"></script>

    <script>
        window.addEventListener("load", function() {
            window.focus();
            document.getElementById("c2canvas").focus();
        });

        // Block scrolling so you don't lose focus
        window.addEventListener("keydown", function(e) { 
            if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) { e.preventDefault(); } 
        }, false);
    </script>
</body>
</html>
