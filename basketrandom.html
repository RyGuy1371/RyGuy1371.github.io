<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basket Random | Fixed Center</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* 1. Prevent the page from having any 'extra' space */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* 2. Position the game container exactly in the middle */
        #c2canvasdiv {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* This pulls it back to the exact center */
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3. Make sure the canvas stays within the screen bounds */
        canvas {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16 / 9; /* Standard for most web games */
            image-rendering: pixelated; /* Keeps the game looking sharp */
        }
    </style>
</head>

<body>
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="800" height="450">
            <h1>Your browser does not support HTML5.</h1>
        </canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/box2d.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/c2runtime.js"></script>

    <script>
        // Force the game to focus so you can play immediately
        window.onload = function() {
            window.focus();
            document.getElementById("c2canvas").focus();
        };
    </script>
</body>
</html>
