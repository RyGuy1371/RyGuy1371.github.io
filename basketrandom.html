<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basket Random | Centered</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* 1. Setup the background */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
        }

        /* 2. The Ghost Container: This centers the game without the engine knowing */
        .center-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        /* 3. The Actual Game Box: Fixed size so it won't go black */
        #c2canvasdiv {
            width: 800px; 
            height: 450px;
            position: relative; /* Essential for the engine */
        }

        canvas {
            width: 800px !important;
            height: 450px !important;
        }
    </style>
</head>
<body>
    <div class="center-screen">
        <div id="c2canvasdiv">
            <canvas id="c2canvas" width="800" height="450"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/box2d.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/c2runtime.js"></script>

    <script>
        window.addEventListener("load", function() {
            window.focus();
            document.getElementById("c2canvas").focus();
        });

        // Key-lock so the page doesn't jump
        window.addEventListener("keydown", function(e) { 
            if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) { e.preventDefault(); } 
        }, false);
    </script>
</body>
</html>
