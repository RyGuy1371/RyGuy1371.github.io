<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basket Random | Centered</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* 1. Reset everything to prevent the "Right-Shift" */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* 2. Standard Construct 2 Container Setup */
        #c2canvasdiv {
            margin: 0 auto;
            width: 800px; /* Base width */
            height: 450px; /* Base height */
        }

        canvas {
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
    </style>
</head>
<body>
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="800" height="450">
            <h1>Your browser does not support HTML5.</h1>
        </canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/box2d.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/c2runtime.js"></script>

    <script>
        // Ensure the game is centered on load
        window.addEventListener("resize", function() {
            window.focus();
        });
    </script>
</body>
</html>
