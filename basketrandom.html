<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Basket Random | GitHub Play</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #c2canvasdiv {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        canvas {
            width: 100% !important; height: auto !important;
            max-width: 100vw; max-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="c2canvasdiv">
        <canvas id="c2canvas" width="800" height="450"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/box2d.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/c2runtime.js"></script>

    <script>
        // Force the game to start and focus
        window.addEventListener("load", function() {
            window.focus();
            document.getElementById("c2canvas").focus();
        });
    </script>
</body>
</html>
