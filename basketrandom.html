<html>
<head>
    <meta charset="UTF-8">
    <title>Basket Random (Clean)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@1520d90d7b2994737acd8f7a633d018f63c22ca7/style.css" type="text/css">
    
    <style>
        /* Hide common ad classes and IDs immediately */
        #adsContainer, .adsbygoogle, #preloader-ad, #banner-ad, [id*="google_ads"], [class*="ad-"], .ads-wrapper {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
        }
    </style>

    <script>
        // 1. Prevent page scrolling
        window.addEventListener("keydown", function(e) { 
            if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) { e.preventDefault(); } 
        }, false);

        // 2. Active Ad-Stripper: Deletes ad elements the moment they appear
        const observer = new MutationObserver(((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.id && (node.id.includes('ad') || node.id.includes('google'))) {
                        node.remove();
                    }
                    if (node.className && typeof node.className === 'string' && node.className.includes('ad')) {
                        node.remove();
                    }
                });
            });
        }));

        observer.observe(document.documentElement, {
            childList: true,
            subtree: true
        });
    </script>
</head>
