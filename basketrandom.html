<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basket Random | Clean Port</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <style>
        /* Force the body to be a rigid, non-scrolling container */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            position: fixed; /* Prevents "pull-to-refresh" on mobile */
        }

        /* This container acts as the "Fake Fullscreen" */
        #game-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ensures the game canvas fills the screen without breaking aspect ratio */
        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        /* Ad-Blocker CSS */
        #adsContainer, .adsbygoogle, [id*="google_ads"], .ads-wrapper {
            display: none !important;
            visibility: hidden !important;
        }
    </style>

    <script>
        // Prevent default browser keys from scrolling or crashing focus
        window.addEventListener("keydown", function(e) {
            if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }
        }, false);

        // This intercepts the "Fullscreen" error before it crashes the game
        window.onerror = function(message, source, lineno, colno, error) {
            if (message.includes("fullscreen")) {
                console.log("Caught fullscreen error - preventing crash.");
                return true; 
            }
        };
    </script>
</head>
